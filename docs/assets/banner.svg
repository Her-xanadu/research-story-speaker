<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">research-story-speaker</title>
  <desc id="desc">File-native, prompt-native, Story-driven autonomous research workspace</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1A14"/>
      <stop offset="55%" stop-color="#10241B"/>
      <stop offset="100%" stop-color="#163528"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A86C"/>
      <stop offset="100%" stop-color="#E2C992"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C9A86C" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#C9A86C" fill-opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1280" height="280" fill="url(#bg)"/>
  <rect width="1280" height="280" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1277" height="277" fill="none" stroke="#C9A86C" stroke-opacity="0.28" stroke-width="1.5"/>
  <line x1="0" y1="278" x2="1280" y2="278" stroke="#C9A86C" stroke-opacity="0.55" stroke-width="2"/>

  <g transform="translate(168 142)" fill="none" stroke="#C9A86C">
    <circle r="86" stroke-opacity="0.18" stroke-width="1"/>
    <circle r="58" stroke-opacity="0.32" stroke-width="1.25" stroke-dasharray="3 7"/>
    <circle r="22" fill="#0B1A14" stroke-opacity="0.85" stroke-width="1.25"/>
    <text x="0" y="5" text-anchor="middle" fill="#EDE6D6" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2.4">STORY</text>
    <g fill="#C9A86C" stroke="none">
      <circle cx="0" cy="-86" r="5.5"/>
      <circle cx="74.5" cy="-43" r="4.5" fill="#E2C992"/>
      <circle cx="74.5" cy="43" r="4.5"/>
      <circle cx="0" cy="86" r="4.5"/>
      <circle cx="-74.5" cy="43" r="4.5"/>
      <circle cx="-74.5" cy="-43" r="4.5"/>
    </g>
    <path d="M8 -85.6 A86 86 0 1 1 -8 -85.6" stroke-opacity="0.45" stroke-width="1.25" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(320 88)">
    <text x="0" y="0" fill="#C9A86C" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" letter-spacing="4.2">AUTONOMOUS RESEARCH WORKSPACE</text>
    <text x="0" y="52" fill="#F4EEE0" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="42">research-story-speaker</text>
    <rect x="0" y="68" width="220" height="1.5" fill="url(#gold)"/>
    <text x="0" y="104" fill="#C5D0C4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18">File-native memory / prompt-native skills / Story as the loop</text>
    <text x="0" y="142" fill="#8FA08F" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" letter-spacing="1.4">v0.2.2 &#183; canonical 8 &#183; research-loop 1 &#183; subagents 5 &#183; skills 13 &#183; RI 6 &#183; scripts 0</text>
  </g>
</svg>
