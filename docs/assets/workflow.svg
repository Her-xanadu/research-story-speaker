<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Two-layer research workflow</title>
  <desc id="desc">Outer W1 reframes Story. Inner W2-W3-W4 runs experiments. W4 is the shifter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12261D"/>
      <stop offset="100%" stop-color="#0B1A14"/>
    </linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#C9A86C"/>
    </marker>
  </defs>
  <rect width="1120" height="480" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="1118" height="478" rx="11" fill="none" stroke="#C9A86C" stroke-opacity="0.28"/>

  <text x="40" y="42" fill="#C9A86C" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="3">TWO-LAYER WORKFLOW</text>
  <text x="40" y="72" fill="#F4EEE0" font-family="Georgia, 'Times New Roman', serif" font-size="22">Reframe rarely. Experiment often.</text>

  <rect x="40" y="104" width="160" height="64" rx="8" fill="#14281E" stroke="#8FA08F" stroke-opacity="0.45"/>
  <text x="120" y="130" text-anchor="middle" fill="#8FA08F" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1.4">W0</text>
  <text x="120" y="150" text-anchor="middle" fill="#EDE6D6" font-size="14" font-family="Georgia, 'Times New Roman', serif">SETUP</text>

  <rect x="248" y="104" width="176" height="64" rx="8" fill="#14281E" stroke="#C9A86C" stroke-opacity="0.7"/>
  <text x="336" y="130" text-anchor="middle" fill="#C9A86C" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1.4">OUTER</text>
  <text x="336" y="150" text-anchor="middle" fill="#F4EEE0" font-size="14" font-family="Georgia, 'Times New Roman', serif">W1 FRAME</text>

  <rect x="904" y="104" width="176" height="64" rx="8" fill="#14281E" stroke="#8FA08F" stroke-opacity="0.45"/>
  <text x="992" y="130" text-anchor="middle" fill="#8FA08F" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1.4">DONE</text>
  <text x="992" y="150" text-anchor="middle" fill="#EDE6D6" font-size="14" font-family="Georgia, 'Times New Roman', serif">W5 HANDOFF</text>

  <path d="M200 136 H240" stroke="#C9A86C" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M424 136 H456" stroke="#C9A86C" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="456" y="92" width="424" height="328" rx="14" fill="#0E1F18" stroke="#C9A86C" stroke-opacity="0.55"/>
  <text x="668" y="122" text-anchor="middle" fill="#C9A86C" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="2.4">INNER LOOP</text>

  <rect x="500" y="148" width="336" height="52" rx="8" fill="#163528" stroke="#C9A86C" stroke-opacity="0.5"/>
  <text x="668" y="170" text-anchor="middle" fill="#C9A86C" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">W2 TEST</text>
  <text x="668" y="188" text-anchor="middle" fill="#F4EEE0" font-size="13" font-family="Georgia, 'Times New Roman', serif">design / run experiment</text>

  <rect x="500" y="224" width="336" height="52" rx="8" fill="#163528" stroke="#C9A86C" stroke-opacity="0.5"/>
  <text x="668" y="246" text-anchor="middle" fill="#C9A86C" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">W3 LEARN</text>
  <text x="668" y="264" text-anchor="middle" fill="#F4EEE0" font-size="13" font-family="Georgia, 'Times New Roman', serif">outcome / discovery</text>

  <rect x="500" y="300" width="336" height="52" rx="8" fill="#163528" stroke="#E2C992" stroke-opacity="0.7"/>
  <text x="668" y="322" text-anchor="middle" fill="#E2C992" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">W4 DECIDE</text>
  <text x="668" y="340" text-anchor="middle" fill="#F4EEE0" font-size="13" font-family="Georgia, 'Times New Roman', serif">keep Story? next test?</text>

  <path d="M668 200 V224" stroke="#C9A86C" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M668 276 V300" stroke="#C9A86C" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M500 326 H476 V174 H500" fill="none" stroke="#C9A86C" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="430" y="256" fill="#C9A86C" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">Story stable</text>

  <path d="M836 326 H888 V136 H904" fill="none" stroke="#8FA08F" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="850" y="86" fill="#8FA08F" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">complete</text>

  <path d="M668 352 V400 H336 V168" fill="none" stroke="#E2C992" stroke-opacity="0.75" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="390" y="430" fill="#E2C992" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">Story / mechanism / route changed ’ back to W1</text>
</svg>
